<style>

html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}

#bag button,#shop button{width:auto;height:auto;border-radius:10px;padding:8px 14px;font-size:14px;background:#2d7ff9;border-color:transparent;touch-action:manipulation}
#bag button.x,#shop button.x{display:block;margin:10px auto 0;background:#555}
#snd{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);pointer-events:auto;width:44px;height:44px;font-size:20px}
#sv{position:absolute;left:64px;top:calc(env(safe-area-inset-top,0px) + 12px);pointer-events:auto;width:44px;height:44px;font-size:20px}
#tm{display:none;position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 164px);background:var(--card);padding:4px 10px;border-radius:10px;font-size:13px;font-weight:700}

button.on{background:var(--on);color:#222;border-color:#fff}button{position:relative;overflow:hidden}button.cool::after{content:attr(data-cd);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);color:#fff;font:800 20px system-ui,sans-serif}

<script>
const T=THREE,$=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a);
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);

let stars;{const arr=[];for(let i=0;i<500;i++){const a=rnd(0,6.28),e=rnd(.15,1.4);arr.push(Math.cos(a)*Math.cos(e)*450,Math.sin(e)*450,Math.sin(a)*Math.cos(e)*450)}const G=new T.BufferGeometry();if(G.setAttribute)G.setAttribute('position',new T.Float32BufferAttribute(arr,3));stars=new T.Points(G,new T.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false,transparent:true,opacity:0,fog:false}));S.add(stars)}
function lh(a,b,t){return ((a>>16&255)*(1-t)+(b>>16&255)*t|0)<<16|((a>>8&255)*(1-t)+(b>>8&255)*t|0)<<8|((a&255)*(1-t)+(b&255)*t|0)}
const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.8});

if(fl)for(let i=0;i<r;i++){const a=rnd(0,6.28),d=rnd(5,r-3);add(new T.ConeGeometry(.15,.5,4),[0xff6fa5,0xffd23f,0xffffff,0xb388ff][i%4],x+Math.cos(a)*d,.25,z+Math.sin(a)*d)}
const a0=th==='main'?0:Math.atan2(-z,-x),dx=Math.cos(a0),dz=Math.sin(a0);
box(r,.06,3,th==='snow'?0xd7dde2:0xc2a070,x+dx*r/2,.03,z+dz*r/2,-a0);box(16,.4,5,0x8a5a2b,x+dx*(r+6),.1,z+dz*(r+6),-a0);
[-1,1].forEach(q=>[-6,-2,2,6].forEach(o=>cyl(.25,.25,1.4,0x5b3a1a,x+dx*(r+6)+dx*o-dz*q*2.5,z+dz*(r+6)+dz*o+dx*q*2.5,-.5)))}

if(th==='wind'){for(let i=0;i<3;i++){const[p,q]=pp(r*.6,i*2.1+.5);cyl(2.2,3,9,0xf2e6d8,p,q);add(new T.ConeGeometry(3,3,8),0xe58fa0,p,10.5,q);const bl=new T.Group();bl.position.set(p,8,q+3.2);add(new T.BoxGeometry(.6,8,.15),0xfafafa,0,0,0,bl);add(new T.BoxGeometry(8,.6,.15),0xfafafa,0,0,0,bl);S.add(bl);spin.push(bl);obs.push({x:p,z:q,r:3.4})}
const[lx,lz]=pp(r*.45,4.2);cyl(1.8,2.4,16,0xffffff,lx,lz);add(new T.ConeGeometry(2.6,3,8),0xd62828,lx,17.5,lz);obs.push({x:lx,z:lz,r:2.5});
for(let i=0;i<6;i++){const[p,q]=pp(r*.72,i*1.05+.3);house(p,q,0xf5e6c8,i%2?0xc0392b:0xd2691e)}
for(let i=0;i<r/3;i++){const[p,q]=pp(rr(8,r-4),rr(0,6.28));tree(p,q)}}
else if(th==='desert'){const[px,pz]=pp(r*.5,1),py=add(new T.ConeGeometry(14,18,4),0xd8c28a,px,9,pz);py.rotation.y=Math.PI/4;obs.push({x:px,z:pz,r:11});
for(let i=0;i<6;i++){const[p,q]=pp(rr(r*.4,r-8),rr(0,6.28)),s=rr(5,9),m=add(new T.IcosahedronGeometry(s,0),0xc9b27c,p,s*.35,q);m.scale.y=.6;obs.push({x:p,z:q,r:s*.85})}
for(let i=0;i<14;i++){const[p,q]=pp(rr(6,r-3),rr(0,6.28));palm(p,q)}
for(let i=0;i<8;i++){const[p,q]=pp(r*.65,i*.8);box(5,3,4,0xe8dcc0,p,1.5,q);box(5.4,.4,4.4,0xcdbf9c,p,3.2,q);obs.push({x:p,z:q,r:3})}}
else if(th==='snow'){const[tx,tz]=pp(r*.45,1.2);[[r*.22,3],[r*.15,6],[r*.08,9]].forEach(([d,h])=>{cyl(d,d+1.5,h,0x7a8088,tx,tz);cyl(d+.2,d+.2,.4,0xffffff,tx,tz,h)});obs.push({x:tx,z:tz,r:r*.24});
for(let i=0;i<16;i++){const[p,q]=pp(r+rr(14,34),rr(0,6.28)),sz=rr(6,12);box(sz,.3,sz*rr(.6,1),0xbfe6f5,p,-.3,q,rr(0,3))}
const[wx,wz]=pp(r*.55,3.5),pd=new T.Mesh(new T.CircleGeometry(7,16),new T.MeshStandardMaterial({color:0x6bc4f5}));pd.rotation.x=-Math.PI/2;pd.position.set(wx,.03,wz);S.add(pd);
for(let i=0;i<18;i++){const[p,q]=pp(rr(8,r-4),rr(0,6.28));pine(p,q)}for(let i=0;i<4;i++){const[p,q]=pp(r*.7,i*1.5+.2);house(p,q,0x8b5a2b,0x5b3a1a)}}

const[rx,rz]=pp(r*.55,4);box(12,4,1.5,0x6b6f7a,rx,2,rz);box(1.5,4,10,0x6b6f7a,rx+6,2,rz+5);[0,1,2,3].forEach(i=>cyl(.8,.8,6,0x8b8f99,rx+i*3.5-5,rz+3));obs.push({x:rx+3,z:rz+2,r:7});
for(let i=0;i<14;i++){const[p,q]=pp(rr(8,r-4),rr(0,6.28));tree(p,q)}}
else if(th==='temple'){const a=Math.atan2(-z,-x)+Math.PI,[tx,tz]=pp(r*.5,a),ST=0x8f8670,ST2=0x7a7260;

const[px,pz]=pp(r*.28,a+1.5),pd=new T.Mesh(new T.CircleGeometry(5,16),new T.MeshStandardMaterial({color:0x2a9df4}));pd.rotation.x=-Math.PI/2;pd.position.set(px,.03,pz);S.add(pd);for(let i=0;i<12;i++){const q=i*Math.PI/6;box(1.4,.5,1.4,0xa09880,px+Math.cos(q)*6,.25,pz+Math.sin(q)*6,q)}
