<!DOCTYPE html>
<html lang="km"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ពិភពវ័នភីស</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;700;800&display=swap">
<style>
:root{--bg:#87ceeb;--card:rgba(10,20,40,.62);--fg:#fff;--btn:rgba(255,255,255,.22);--on:#ffd23f}
@media (prefers-color-scheme: dark){:root{--bg:#0b1d33;--card:rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#0b1d33}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}#hpw{height:14px;min-width:150px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden;margin:4px 0}#hp{height:100%;width:100%;background:#4ade80;font:700 10px/14px system-ui;color:#000;white-space:nowrap;overflow:hidden;padding-left:4px;box-sizing:border-box}#bAtk{background:rgba(255,80,80,.45)}#mm{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px)}
#hud{position:fixed;inset:0;pointer-events:none}
#top{display:none;position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--card);padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.5}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--card);padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .3s;white-space:normal;text-align:center;width:max-content;max-width:80vw;font-size:13px}
#help{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);transform:translateX(-50%);font-size:12px;opacity:.8;white-space:nowrap;transition:opacity 1s}
#stick{position:absolute;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:120px;height:120px;border-radius:50%;background:var(--btn);border:2px solid rgba(255,255,255,.4);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(255,255,255,.65)}
#btns{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);display:grid;grid-template-columns:auto auto auto;gap:8px;pointer-events:auto}
button{font:700 11px system-ui,sans-serif;color:#fff;background:var(--btn);border:2px solid rgba(255,255,255,.45);border-radius:50%;width:56px;height:56px;touch-action:none}
#bag,#shop{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,380px);max-height:72vh;overflow-y:auto;background:rgba(15,20,40,.95);border:2px solid rgba(255,255,255,.45);border-radius:16px;padding:12px;pointer-events:auto;touch-action:pan-y;z-index:5;font-size:15px}
#bag .row,#shop .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.15)}
#bag button,#shop button{width:auto;height:auto;border-radius:10px;padding:8px 14px;font-size:14px;background:#2d7ff9;border-color:transparent;touch-action:manipulation}
#bag button.x,#shop button.x{display:block;margin:10px auto 0;background:#555}
#snd{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);pointer-events:auto;width:44px;height:44px;font-size:20px}
#sv{position:absolute;left:64px;top:calc(env(safe-area-inset-top,0px) + 12px);pointer-events:auto;width:44px;height:44px;font-size:20px}
#tm{display:none;position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 164px);background:var(--card);padding:4px 10px;border-radius:10px;font-size:13px;font-weight:700}
#fl{position:absolute;inset:0;opacity:0;transition:opacity .5s;pointer-events:none}
#qst{display:none;position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 130px);background:var(--card);padding:4px 10px;border-radius:10px;font-size:13px;font-weight:700}
button.on{background:var(--on);color:#222;border-color:#fff}button{position:relative;overflow:hidden}button.cool::after{content:attr(data-cd);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);color:#fff;font:800 20px system-ui,sans-serif}
#bEat{display:none}

function lh(a,b,t){return ((a>>16&255)*(1-t)+(b>>16&255)*t|0)<<16|((a>>8&255)*(1-t)+(b>>8&255)*t|0)<<8|((a&255)*(1-t)+(b&255)*t|0)}
const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.8});

// ===== Realistic grass texture + material =====
function makeGrassTex(){
  const c=document.createElement('canvas');c.width=c.height=512;
  const x=c.getContext('2d');
  // base dirt/grass mix
  x.fillStyle='#3d6b2e';x.fillRect(0,0,512,512);
  // noise layers for variation
  for(let i=0;i<18000;i++){
    const px=Math.random()*512,py=Math.random()*512,sz=Math.random()*1.8+0.3;
    const g=40+Math.random()*50,r=30+Math.random()*30,b=20+Math.random()*20;
    x.fillStyle=`rgb(${r},${g},${b})`;
    x.fillRect(px,py,sz,sz);
  }
  // longer grass blade strokes
  x.lineCap='round';
  for(let i=0;i<900;i++){
    const px=Math.random()*512,py=Math.random()*512,h=Math.random()*28+8,lean=(Math.random()-.5)*8;
    const g=80+Math.random()*90,r=40+Math.random()*40,b=25+Math.random()*30;
    x.strokeStyle=`rgba(${r},${g},${b},.75)`;
    x.lineWidth=Math.random()*1.4+0.4;
    x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+lean*.4,py-h*.5,px+lean,py-h);x.stroke();
  }
  // lighter tips
  for(let i=0;i<400;i++){
    const px=Math.random()*512,py=Math.random()*512;
    x.fillStyle=`rgba(180,220,120,${Math.random()*.4+.1})`;
    x.fillRect(px,py,1.2,Math.random()*4+1);
  }
  const tex=new T.CanvasTexture(c);
  tex.wrapS=tex.wrapT=T.RepeatWrapping;
  tex.repeat.set(8,8);
  tex.anisotropy=4;
  return tex;
}
const GRASS_TEX=makeGrassTex();
const grassMat=()=>new T.MeshStandardMaterial({
  map:GRASS_TEX,
  roughness:.92,
  metalness:.02,
  color:0x5a9a42
});
